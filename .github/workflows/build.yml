name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build dependencies, run tests and publish
        shell: pwsh
        run: ./tools/build.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: LostVikingAssist-win-x64
          path: dist/LostVikingAssist-win-x64.zip
          if-no-files-found: error
